<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Image Gallery</h1>


    <div class="buttons">

        <button onclick="filterImages('all')">
            All
        </button>

        <button onclick="filterImages('onepiece')">
            One Piece
        </button>

        <button onclick="filterImages('naruto')">
            Naruto
        </button>

        <button onclick="filterImages('bleach')">
            Bleach
        </button>

        <button onclick="filterImages('demon')">
            Demon Slayer
        </button>

        <button onclick="filterImages('mha')">
            MHA
        </button>

    </div>

    <div class="gallery">

        <div class="image-box onepiece">
            <img
                src="Images/luffy.jpg"
                alt="Luffy"
                onclick="openLightbox(this)"
            >
        </div>


        <div class="image-box onepiece">
            <img
                src="Images/zoro.jpg"
                alt="Zoro"
                onclick="openLightbox(this)"
            >
        </div>


        <div class="image-box naruto">
            <img
                src="Images/naruto.jpg"
                alt="Naruto"
                onclick="openLightbox(this)"
            >
        </div>


        <div class="image-box naruto">
            <img
                src="Images/sasuke.avif"
                alt="Sasuke"
                onclick="openLightbox(this)"
            >
        </div>


        <div class="image-box bleach">
            <img
                src="Images/ichigo.jpg"
                alt="Ichigo"
                onclick="openLightbox(this)"
            >
        </div>


        <div class="image-box bleach">
            <img
                src="Images/rukia.jpg"
                alt="Rukia"
                onclick="openLightbox(this)"
            >
        </div>


        <div class="image-box demon">
            <img
                src="Images/tanjiro.avif"
                alt="Tanjiro"
                onclick="openLightbox(this)"
            >
        </div>


        <div class="image-box demon">
            <img
                src="Images/nezuko.avif"
                alt="Nezuko"
                onclick="openLightbox(this)"
            >
        </div>


        <div class="image-box mha">
            <img
                src="Images/deku.jpg"
                alt="Deku"
                onclick="openLightbox(this)"
            >
        </div>


        <div class="image-box mha">
            <img
                src="Images/bakugo.jpg"
                alt="Bakugo"
                onclick="openLightbox(this)"
            >
        </div>

    </div>


    <div class="lightbox" id="lightbox">

        <span class="close" onclick="closeLightbox()">
            &times;
        </span>


        <button class="prev" onclick="previousImage()">
            Previous
        </button>


        <img id="largeImage" src="" alt="Anime Image">


        <button class="next" onclick="nextImage()">
            Next
        </button>

    </div>


    <script src="script.js"></script>

</body>
</html>
